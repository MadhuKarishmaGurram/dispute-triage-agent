# Runs the deterministic safety and guardrail tests on every push and pull request.
# These need no AI and no Google login, so they are fast, free and reliable.
# (The AI evaluations in evals/ are run manually, since they need credentials and cost money.)

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # this workflow only needs to read the code

jobs:
  tests:
    name: Safety and guardrail tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install uv
        # Pinned to an exact commit so a changed or compromised tag can't alter what runs.
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install Python and the locked dependencies
        run: uv sync --frozen

      - name: Run the tests
        run: uv run --frozen pytest tests -v